name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64 and arm64: onnxruntime-node ships a Linux binary for each, so both
      # architectures work — but the wrong one produces a bot that logs in and
      # detects no speech, which is why the image build verifies it loads.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The build's own checks run inside the builder. This runs the published
      # amd64 image the way a VPS would, so a broken publish is caught here and
      # not by someone deploying it.
      # The build's own check runs inside the builder, which on a multi-arch
      # build may not be the target architecture. This pulls the published
      # amd64 image and verifies it the way a VPS would run it, so a broken
      # publish is caught here rather than by whoever deploys it.
      - name: Smoke-test the published amd64 image
        run: |
          docker run --rm --platform linux/amd64 \
            ${{ env.IMAGE }}:sha-$(git rev-parse --short HEAD) \
            deno task verify
